- id: no-verify
  statement: Hooks are gates.
  severity: must_fix
  enforce: hook
  hook: bash-guard
  targets: [claude-md]
  guard:
    argv0: git
    subcommands: [commit, push]
    flags: {all: [--no-verify], commit: [-n]}
    env: {LEFTHOOK: ["0"]}
    config: [core.hooksPath]
    reason: hooks are gates
- id: edits
  statement: Edit the source.
  severity: must_fix
  enforce: hook
  hook: edit-guard
  targets: [claude-md]
- id: infra
  statement: Infra changes need the user.
  severity: must_fix
  enforce: hook
  hook: bash-guard
  targets: [claude-md]
  guard:
    commands:
      terraform: [apply, state rm]
      aws: ["delete-*"]
    reason: infra changes need the user
