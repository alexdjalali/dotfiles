# The rule catalog: each rule stated once, with how it is enforced.
# Templates reference a rule with {{rule "id"}}; enforce says what stands
# behind it (hook | lint | review | prose). See ADR-0001.

- id: no-verify
  statement: Don't bypass hooks (`--no-verify`, `LEFTHOOK=0`, overriding `core.hooksPath`); a hook failure is a red fast check — fix, re-stage, retry.
  category: git
  severity: must_fix
  enforce: hook
  hook: bash-guard
  summary: "Never bypass hooks (`--no-verify`) — a failing hook is a red fast check: fix, re-stage, retry."
  targets: [claude-md, rules/development-practices, cursor/development-practices, cursor/global-standards]
  guard:
    argv0: git
    subcommands: [commit, push, merge, rebase, am]
    flags: {all: [--no-verify], commit: [-n]}
    env: {LEFTHOOK: ["0", "false"]}
    config: [core.hooksPath]
    reason: git hooks are gates; fix the failure instead of bypassing them

- id: no-suppressions
  statement: "Satisfy a check; don't silence it. An agent adds no inline suppression (`//nolint`, `#nosec`, `nosemgrep`, `# noqa`, `type: ignore`, `eslint-disable`, `@ts-ignore` / `@ts-expect-error`), no exemption / baseline / allowlist entry, no raised ratchet ceiling, and no skipped test to get green. A rule that is wrong is changed by an ADR the user approves; an exception is added by the user. The `guard-suppressions.sh` PreToolUse hook blocks the inline markers and growing exemption files."
  category: quality
  severity: must_fix
  enforce: hook
  hook: edit-guard
  summary: "Satisfy a check, never silence it — no new `nolint`/`noqa`/`type: ignore`/`eslint-disable`/`ts-ignore`, exemption or baseline entry, raised ratchet, or skipped test; a wrong rule is changed by an ADR the user approves."
  targets: [claude-md, rules/development-practices, cursor/development-practices, cursor/global-standards]

- id: docs-first
  statement: "Docs are the first priority and the agent's map: every change refreshes every doc it touches, in the same commit — doc comments on every symbol, test docs (Why this test is important / What it tests), READMEs, docs/ pages, CLAUDE.md / AGENTS.md, ADRs and generated references. Read the docs before the code, write or update the doc before or with the code, never after. A commit with truly no doc impact says `Docs-Impact: none (<reason>)` in its message. The `guard-docs.sh` PreToolUse hook blocks a code commit that refreshes no docs and declares nothing."
  category: docs
  severity: must_fix
  enforce: hook
  hook: commit-guard
  summary: "Docs first: every change refreshes every doc it touches (doc comments, test Why/What docs, READMEs, docs/, CLAUDE.md) in the same commit; a commit with no doc impact declares `Docs-Impact: none (<reason>)`."
  targets: [claude-md, rules/documentation-sync, cursor/documentation-sync, cursor/global-standards]

- id: cross-cutting
  statement: "**Cross-cutting changes are traced, not assumed.** A change that reaches past its own layer (new deployable, external call, contract, schema, config field, permission, or an infrastructure or CI edit) walks `~/.claude/templates/cross-cutting.md` when planning, before committing, and in review: every layer done, not needed with a reason, or a gap, plus the rollout order. Silence is a gap."
  category: quality
  severity: must_fix
  enforce: review
  summary: "Cross-cutting changes walk every layer (contracts, data, config, secrets, permissions, network, build, CI/CD, IaC, deploy, env parity, observability) when planning, before committing, and in review, and state the rollout order; silence is a gap."
  targets: [claude-md, cursor/global-standards]

- id: no-force-push-main
  statement: Don't force-push main or master.
  category: git
  severity: must_fix
  enforce: hook
  hook: bash-guard-builtin
  summary: never force-push main/master
  targets: [claude-md, rules/development-practices, cursor/development-practices, cursor/global-standards]

- id: generated-code-not-hand-edited
  statement: Change generated code at its source (proto, schema, template, `wire.go`) and regenerate through the project's CLI instead of editing the output; commit the output; CI fails on drift.
  category: codegen
  severity: must_fix
  enforce: hook
  hook: edit-guard
  summary: "never hand-edit — change the source and regenerate through the project's CLI; commit the output; CI fails on drift."
  targets: [rules/development-practices, rules/standards-golang, cursor/development-practices]

# Review lenses: rendered into review-diff's checklist by {{lenses "review"}}.
- id: review-edge-cases
  statement: "edge cases (empty/zero/boundaries/unicode/large/first-run)"
  category: Correctness
  severity: must_fix
  enforce: review
  targets: [review-lenses]
- id: review-error-paths
  statement: "error paths (unchecked returns, swallowed exceptions, partial failure without rollback)"
  category: Correctness
  severity: must_fix
  enforce: review
  targets: [review-lenses]
- id: review-concurrency-and-shared-state
  statement: "concurrency and shared state"
  category: Correctness
  severity: must_fix
  enforce: review
  targets: [review-lenses]
- id: review-resource-lifecycle
  statement: "resource lifecycle (leaks, cleanup skipped on early return)"
  category: Correctness
  severity: must_fix
  enforce: review
  targets: [review-lenses]
- id: review-contracts
  statement: "contracts (changed signatures with stale callers, breaking persisted/wire formats, migration order)"
  category: Correctness
  severity: must_fix
  enforce: review
  targets: [review-lenses]
- id: review-security
  statement: "security (injection, authn/z, secrets, unvalidated boundary input, SSRF/path traversal)"
  category: Quality
  severity: should_fix
  enforce: review
  targets: [review-lenses]
- id: review-performance
  statement: "performance (uncached hot paths, N+1, redundant work)"
  category: Quality
  severity: should_fix
  enforce: review
  targets: [review-lenses]
- id: review-dead-code
  statement: "dead code (confirm \"unused\" with a caller search)"
  category: Quality
  severity: should_fix
  enforce: review
  targets: [review-lenses]
- id: review-consistency-and-dry
  statement: "consistency and DRY (MUST cite the existing pattern/implementation `file:line`)"
  category: Quality
  severity: should_fix
  enforce: review
  targets: [review-lenses]
- id: review-tests
  statement: "tests (`testing.md`: behavior assertions a one-character bug would fail, tier-correct doubles — a violation is `must_fix` — parsimony, new deps mocked in all existing tests)"
  category: Quality
  severity: should_fix
  enforce: review
  targets: [review-lenses]
- id: review-standards
  statement: "standards (file > 800 excluding generated files, function > 50, nesting > 4, untyped `any`, bare `except:`, hardcoded config)"
  category: Quality
  severity: should_fix
  enforce: review
  targets: [review-lenses]
- id: review-design
  statement: "design (`code-addition-checklist.md`: the One Idea — a concrete type where a core interface belongs, impl selection by `if`/import instead of a `Kind` factory, a factory with no stub default or a silent fallback on an unknown kind, construction or I/O outside the composition root, globals/singletons, coupling, leaking layers)"
  category: Quality
  severity: should_fix
  enforce: review
  targets: [review-lenses]
- id: review-codegen
  statement: "codegen (hand-written code a project generator should own, a hand-edited generated file, a source change without regenerated output, a repeated shape that should be a template)"
  category: Quality
  severity: should_fix
  enforce: review
  targets: [review-lenses]
- id: review-config
  statement: "config (env read outside the config layer, a field with no fail-safe `base` default or no doc, a hard-coded value that belongs in config)"
  category: Quality
  severity: should_fix
  enforce: review
  targets: [review-lenses]
- id: review-resilience
  statement: "resilience (an external call without a timeout, retry/breaker/logging inlined instead of a decorator, retry on a permanent error, a doubled-up retry over an SDK that already retries)"
  category: Quality
  severity: should_fix
  enforce: review
  targets: [review-lenses]
- id: review-errors
  statement: "errors (code-less errors, internal detail leaked past the transport edge)"
  category: Quality
  severity: should_fix
  enforce: review
  targets: [review-lenses]
- id: review-observability
  statement: "observability (silent failure branches, context-free errors, a new path with no log/metric/span, missing trace correlation)"
  category: Quality
  severity: should_fix
  enforce: review
  targets: [review-lenses]
- id: review-infra
  statement: "cross-cutting (`cross-cutting.md`: a layer the change reaches but did not update — a new cloud/queue/storage call without its permission grant in the same change, a new deployable without its image repository or CI path, a CI workflow missing a token permission, a config field missing from an environment, a renamed metric with a stale dashboard or alert, a new query without tenant scoping; two files that must agree — source and generated output, a lock file, an image pinned per environment — neither generated nor guarded; a trigger with no Cross-cutting lines)"
  category: Correctness
  severity: must_fix
  enforce: review
  targets: [review-lenses]
- id: review-rollout
  statement: "rollout (code that needs infrastructure or a migration not yet live at deploy, old and new versions unable to coexist during the rollout, a manual step a merge will not perform left unstated, no rollback path, an irreversible step not called out)"
  category: Correctness
  severity: must_fix
  enforce: review
  targets: [review-lenses]
- id: review-docs
  statement: "docs — `must_fix` (`documentation-sync.md`): a changed symbol whose doc comment wasn't revised, an inline comment or docstring — in the diff or on a caller you read — that contradicts the code, a test without its Why/What doc, a README / docs page / CLAUDE.md / ADR / generated reference that now describes old behavior, a missing doc for a new symbol, flag, config field or endpoint, a `Docs-Impact: none` claim the diff contradicts"
  category: Quality
  severity: must_fix
  enforce: review
  targets: [review-lenses]
- id: review-suppressions
  statement: "suppressions (a new `nolint`/`noqa`/`type: ignore`/`eslint-disable`/`ts-ignore`, exemption or baseline entry, raised ratchet ceiling, or skipped/xfailed test the user didn't approve — `must_fix`: revert it and fix the code)"
  category: Quality
  severity: must_fix
  enforce: review
  targets: [review-lenses]
- id: review-bloat
  statement: "bloat (`code-addition-checklist.md` *Budget*: an interface/`Kind`/factory/config field for an internal collaborator with one implementation, hand-written ceremony a generator could emit, a test re-asserting a lower tier's behavior or testing structure, a CLI step wrapping a stock tool, a generic capability built in the product instead of the shared library — name the lines that can go)"
  category: Quality
  severity: should_fix
  enforce: review
  targets: [review-lenses]

# Audit categories: rendered into audit's quick sweep by {{lenses "audit"}}.
- id: audit-dry
  statement: "duplicated logic with slight variations"
  category: DRY
  severity: should_fix
  enforce: review
  targets: [audit-lenses]
- id: audit-coupling
  statement: "imports across too many layers, cycles"
  category: coupling
  severity: should_fix
  enforce: review
  targets: [audit-lenses]
- id: audit-complexity
  statement: "functions > 50 lines, nesting > 4"
  category: complexity
  severity: should_fix
  enforce: review
  targets: [audit-lenses]
- id: audit-anti-patterns
  statement: "god objects, feature envy, shotgun surgery"
  category: anti-patterns
  severity: should_fix
  enforce: review
  targets: [audit-lenses]
- id: audit-dead-code
  statement: "exported symbols with no callers, commented-out blocks > 10 lines"
  category: dead code
  severity: should_fix
  enforce: review
  targets: [audit-lenses]
- id: audit-convention-drift
  statement: "a reinvented helper, a divergent idiom — cite the established one"
  category: convention drift
  severity: should_fix
  enforce: review
  targets: [audit-lenses]
- id: audit-test-gaps
  statement: "public logic untested, structure-not-behavior assertions, fakes where `testing.md` forbids them"
  category: test gaps
  severity: should_fix
  enforce: review
  targets: [audit-lenses]
- id: audit-one-idea-drift
  statement: "`code-addition-checklist.md`: concrete dependencies where a core interface belongs, impl chosen by `if`/import instead of a `Kind` factory, globals/singletons, inlined retry/logging, code-less errors, env reads outside the config layer"
  category: One-Idea drift
  severity: should_fix
  enforce: review
  targets: [audit-lenses]
- id: audit-codegen-gaps
  statement: "hand-written code a generator should own, hand-edited generated files, repeated shapes with no template"
  category: codegen gaps
  severity: should_fix
  enforce: review
  targets: [audit-lenses]
- id: audit-theory-gaps
  statement: "one kind of work implemented many ways (a long `switch` dispatching it, N packages declaring the same struct) — name the missing noun and its single shape; a component with no reference implementation"
  category: theory gaps
  severity: should_fix
  enforce: review
  targets: [audit-lenses]
- id: audit-infra-drift
  statement: "pairs that must agree but are neither generated nor guarded: a call and its IAM grant, a built image and its registry, a deployable and its CI path, a config field across environments, a metric and its dashboard or alert, generated clients across modules, lock files, versions or digests pinned per environment"
  category: infra drift
  severity: should_fix
  enforce: review
  targets: [audit-lenses]
- id: audit-bloat
  statement: "measure, then name what can go: unreachable code (`deadcode -test=false`, `vulture`, `knip`), interfaces with one implementation that aren't an external boundary, test lines ÷ production lines and assertions per test line, config code + config tests vs features, a dev CLI wrapping stock tools, inline suppressions and exemption files"
  category: bloat
  severity: should_fix
  enforce: review
  targets: [audit-lenses]
- id: audit-docs
  statement: "stale or missing docs: symbols without doc comments, comments or docstrings that contradict the code, tests without Why/What docs, READMEs / docs pages / CLAUDE.md / ADRs describing behavior the code no longer has, generated references out of date — each is a finding, ranked high"
  category: docs
  severity: must_fix
  enforce: review
  targets: [audit-lenses]
- id: audit-operability
  statement: "external calls without timeouts, failure paths with no log/metric/span"
  category: operability
  severity: should_fix
  enforce: review
  targets: [audit-lenses]
