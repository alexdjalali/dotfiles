# Gryph config: a log-only, cross-agent audit trail of tool calls (ADR-0003).
#
# install.sh links this file to the path Gryph reads on macOS:
#   ~/Library/Application Support/safedep/gryph/config.yml
# Gryph reads only config.yml there and renames a config.yaml to it on load.
# (GRYPH_CONFIG_DIR or an absolute XDG_CONFIG_HOME move the directory.)
#
# Edit this file, not `gryph config set`: that command rewrites the whole
# config through the link into this tracked file, with every default spelled
# out and every comment dropped.
# tests/claude/gryph_config_test.sh pins the keys below.

logging:
  # minimal keeps the action, path, Bash command line, result and timestamp,
  # and drops output and content previews. ADR-0003 keeps previews out of the
  # database. No agents.<name>.logging_level override may raise it.
  level: minimal

storage:
  # Events older than this are pruned. 90 is Gryph's default, stated here
  # because ADR-0003 relies on it.
  retention_days: 90

policy:
  # Off: Gryph registers no policy check and never returns a permission
  # decision, so its hooks only observe. Steering lives in Probity, per project.
  enabled: false
